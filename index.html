<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0d11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atelier">
<link rel="manifest" href="./manifest.json">
<title>Atelier — Tarefas, Carreira, Rendimento</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Grenze+Gotisch:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./base.css">
<link rel="stylesheet" href="./layout.css">
<link rel="stylesheet" href="./componentes.css">
<link rel="stylesheet" href="./paginas.css">
<link rel="stylesheet" href="./responsivo.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" id="logo"></div>
    <div class="header-right">
      <div id="syncPill" class="sync-pill" data-state="saved"><span class="sp-dot"></span><span class="sp-text">Salvo</span></div>
      <div id="cloudPill" class="sync-pill cloud-pill" data-state="synced" hidden><span class="sp-dot"></span><span class="sp-text"></span></div>
      <button class="search-btn" data-a="openSearch" title="Buscar (Ctrl+K)" aria-label="Buscar">🔍</button>
      <div id="timerWidget" class="timer">
        <span id="tlabel">Pronto</span>
        <b id="ttime">00:00</b>
        <button id="tstop" style="display:none">⏸ Parar</button>
      </div>
    </div>
    <div id="lvl"></div>
  </header>
  <div id="backupBanner"></div>
  <nav id="nav"></nav>
  <main id="app"></main>
</div>
<nav class="bottom-nav" id="bottomNav"></nav>
<div class="more-sheet" id="moreSheet"></div>
<div id="toast" class="toast"></div>

<!-- JS na ordem de dependência — defer preserva a ordem e roda após o DOM estar pronto -->
<script src="./estado.js"    defer></script>
<script src="./logica.js"    defer></script>
<script src="./interface.js" defer></script>
<script src="./app.js"       defer></script>
<script src="./supabase-config.js" defer></script>
<script src="./auth.js"      defer></script>
<script src="./onboarding.js" defer></script>
<script src="./import-data.js" defer></script>
<script src="./merge.js"       defer></script>
<script src="./sync.js"       defer></script>
</body>
</html>
