<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0d11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atelier">
<link rel="manifest" href="./manifest.json">
<title>Atelier — Tarefas, Carreira, Rendimento</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Grenze+Gotisch:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" id="logo"></div>
    <button class="search-btn" data-a="openSearch" title="Buscar (Ctrl+K)" aria-label="Buscar">🔍</button>
    <div id="lvl"></div>
    <div id="timerWidget" class="timer">
      <span id="tlabel">Pronto</span>
      <b id="ttime">00:00</b>
      <button id="tstop" style="display:none">⏸ Parar</button>
    </div>
  </header>
  <div id="backupBanner"></div>
  <nav id="nav"></nav>
  <main id="app"></main>
</div>
<nav class="bottom-nav" id="bottomNav"></nav>
<div class="more-sheet" id="moreSheet"></div>
<div id="toast" class="toast"></div>

<script src="./app.js"></script>
</body>
</html>
